<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Lovedale Holidays</title>
<link rel="icon" href="assets/logo.jpeg">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="inner">
<section class="page-head"><div class="wrap"><h1>Contact <span class="red">Us</span></h1><p>Call or chat on WhatsApp during business hours. We usually reply within minutes.</p></div></section>
<section class="section wrap contact-grid">
  <div class="card">
    <h3>Talk to us</h3>
    <p><b>Phone / WhatsApp</b><br><a data-phone="text" href="#">+91 90729 55363</a></p>
    <p><b>Business hours</b><br><span data-hours></span></p>
    <p><b>Website</b><br>lovedale.co.in</p>
    <div class="cta"><a class="btn" data-phone href="#">Call Now</a><a class="btn btn-ghost-dark" data-wa href="#">WhatsApp</a></div>
  </div>
  <form class="card" id="contactForm">
    <h3>Send an enquiry</h3>
    <label>Name<input name="name" required></label>
    <label>Phone<input name="phone" type="tel" required></label>
    <label>Message<textarea name="msg" rows="4" placeholder="Dates, places, number of travellers..."></textarea></label>
    <button class="btn" type="submit">Send via WhatsApp</button>
  </form>
</section>
<script src="js/site-config.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById("contactForm").addEventListener("submit", e => {
  e.preventDefault(); const f = new FormData(e.target);
  const m = `Hello Lovedale Holidays,\nName: ${f.get("name")}\nPhone: ${f.get("phone")}\n${f.get("msg")}`;
  window.open(`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(m)}`, "_blank");
});
</script>
</body>
</html>
